<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANTAU — Formatter Berita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #e8e2d9;
      --muted: #7a7469;
      --accent: #c9252d;
      --accent-dim: rgba(201,37,45,0.12);
      --gold: #c8a96e;
      --gold-dim: rgba(200,169,110,0.12);
      --green: #22c55e;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Source Sans 3', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      position: sticky; top: 0;
      background: rgba(13,13,13,0.96);
      backdrop-filter: blur(12px);
      z-index: 200;
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center;
      justify-content: space-between;
      gap: 1.5rem; padding: 1rem 0;
    }
    .brand { display: flex; align-items: baseline; gap: 0.6rem; flex-shrink: 0; text-decoration: none; }
    .brand-name { font-family: var(--font-serif); font-size: 1.7rem; font-weight: 900; letter-spacing: 0.12em; color: var(--text); }
    .brand-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin-bottom: 3px; }
    .brand-sub { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }

    .nav-links { display: flex; gap: 0.5rem; align-items: center; }
    .nav-link {
      color: var(--muted); text-decoration: none;
      font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.4rem 0.8rem; border: 1px solid transparent;
      transition: all 0.15s;
    }
    .nav-link:hover { color: var(--text); border-color: var(--border); }
    .nav-link.active { color: var(--gold); border-color: var(--gold); background: var(--gold-dim); }

    /* ── MAIN ── */
    main { max-width: 680px; margin: 2.5rem auto; padding: 0 2rem; }

    .page-title {
      font-family: var(--font-serif);
      font-size: 1.6rem; font-weight: 700;
      color: var(--text); margin-bottom: 0.4rem;
    }
    .page-sub {
      font-size: 0.8rem; color: var(--muted);
      letter-spacing: 0.05em; margin-bottom: 2rem;
      padding-bottom: 1.25rem; border-bottom: 1px solid var(--border);
    }

    /* Step indicator */
    .steps {
      display: flex; gap: 0; margin-bottom: 2rem;
      border: 1px solid var(--border);
    }
    .step {
      flex: 1; padding: 0.55rem 1rem;
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); text-align: center;
      border-right: 1px solid var(--border); background: var(--surface);
      transition: all 0.2s;
    }
    .step:last-child { border-right: none; }
    .step.active { color: var(--gold); background: var(--gold-dim); }
    .step.done { color: var(--green); background: rgba(34,197,94,0.06); }

    /* Form elements */
    .field { margin-bottom: 1.25rem; }
    .field-row { display: flex; gap: 1rem; margin-bottom: 1.25rem; }
    .field-row .field { flex: 1; margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.5rem;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text);
      padding: 0.6rem 0.9rem; font-family: var(--font-sans);
      font-size: 0.9rem; font-weight: 300; outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="date"]:focus,
    textarea:focus { border-color: var(--gold); }
    input[type="date"] { color-scheme: dark; }

    textarea {
      resize: vertical; line-height: 1.7;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
    }

    /* Buttons */
    .btn {
      background: var(--accent); color: #fff; border: none;
      padding: 0.6rem 1.4rem; font-family: var(--font-sans);
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer; transition: background 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: #a51d24; }
    .btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }

    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.6rem 1.2rem; font-family: var(--font-sans);
      font-size: 0.82rem; font-weight: 400; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }

    .btn-gold {
      background: var(--gold); color: #111; border: none;
      padding: 0.6rem 1.4rem; font-family: var(--font-sans);
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer; transition: background 0.2s;
    }
    .btn-gold:hover { background: #b8994e; }

    .btn-row { display: flex; gap: 0.6rem; margin-top: 1.5rem; }
    .btn-row .btn, .btn-row .btn-gold { flex: 1; }

    /* Edit items */
    .edit-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); margin-bottom: 1.5rem; }
    .edit-item { background: var(--bg); padding: 1rem 1.25rem; }
    .edit-item:hover { background: var(--surface); }
    .edit-num {
      font-size: 0.65rem; letter-spacing: 0.12em; color: var(--accent);
      text-transform: uppercase; margin-bottom: 0.4rem;
    }
    .edit-item input {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid var(--border); color: var(--text);
      padding: 0.3rem 0; font-family: var(--font-sans);
      font-size: 0.95rem; font-weight: 400; outline: none;
      transition: border-color 0.2s;
    }
    .edit-item input:focus { border-bottom-color: var(--gold); }
    .edit-url {
      font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem;
      word-break: break-all; font-family: 'Courier New', monospace;
    }

    /* Output */
    .output-box {
      background: var(--surface2); border: 1px solid var(--border);
      padding: 1.5rem; margin-bottom: 1.25rem;
    }
    .output-box textarea {
      background: transparent; border: none;
      border-bottom: 1px solid var(--border);
      font-size: 0.83rem; line-height: 1.85; color: #b8afa2;
      padding: 0 0 0.5rem 0;
    }
    .output-box textarea:focus { border-bottom-color: var(--gold); }

    .copy-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border);
    }
    .copy-info { font-size: 0.72rem; color: var(--muted); }
    .copy-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 0.3rem 1rem; font-size: 0.75rem; font-family: var(--font-sans);
      letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
    .copy-btn.copied { border-color: var(--green); color: var(--green); }

    /* Error */
    .error-msg {
      font-size: 0.82rem; color: var(--accent);
      margin-bottom: 1rem; padding: 0.5rem 0.75rem;
      border-left: 2px solid var(--accent);
      background: var(--accent-dim);
    }

    footer {
      text-align: center; padding: 2rem;
      font-size: 0.75rem; color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 3rem; letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      .header-inner { flex-wrap: wrap; }
      .nav-links { order: 3; width: 100%; }
      main { padding: 0 1rem; }
      .field-row { flex-direction: column; gap: 0; }
      .field-row .field { margin-bottom: 1.25rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="/">
      <span class="brand-name">PANTAU</span>
      <div class="brand-dot"></div>
      <span class="brand-sub">Pemerintahan RI</span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="/">Berita</a>
      <a class="nav-link active" href="/formatter.html">Formatter</a>
    </div>
  </div>
</header>

<main>
  <div class="page-title">Formatter Digest</div>
  <div class="page-sub">Susun kurasi berita siap kirim ke grup · No API · Instan</div>

  <!-- Step indicator -->
  <div class="steps">
    <div class="step active" id="step1">1 · Input</div>
    <div class="step" id="step2">2 · Edit Judul</div>
    <div class="step" id="step3">3 · Salin</div>
  </div>

  <!-- PANEL 1: INPUT -->
  <div id="panel-input">
    <div class="field-row">
      <div class="field">
        <label for="fDate">Tanggal</label>
        <input type="date" id="fDate" />
      </div>
      <div class="field">
        <label for="fInitials">Inisial</label>
        <input type="text" id="fInitials" value="PS" maxlength="8" placeholder="PS" />
      </div>
    </div>
    <div class="field">
      <label for="fUrls">URLs Berita <span style="color:var(--muted);font-size:0.65rem;text-transform:none;letter-spacing:0">(satu per baris)</span></label>
      <textarea id="fUrls" rows="12" placeholder="https://kompas.com/...&#10;https://tempo.co/...&#10;https://detik.com/..."></textarea>
    </div>
    <div id="inputError" class="error-msg" style="display:none"></div>
    <div class="btn-row">
      <button class="btn" onclick="handleGenerate()">Generate →</button>
    </div>
  </div>

  <!-- PANEL 2: EDIT -->
  <div id="panel-edit" style="display:none">
    <p style="font-size:0.82rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.6">
      Judul diekstrak dari URL slug. Koreksi yang kurang tepat sebelum finalisasi.
    </p>
    <div class="edit-list" id="editList"></div>
    <div class="btn-row">
      <button class="btn-ghost" onclick="goBack()">← Kembali</button>
      <button class="btn-gold" onclick="handleFinalize()">Finalisasi →</button>
    </div>
  </div>

  <!-- PANEL 3: OUTPUT -->
  <div id="panel-output" style="display:none">
    <div class="output-box">
      <textarea id="outputText" readonly rows="2"></textarea>
      <div class="copy-row">
        <span class="copy-info" id="copyInfo"></span>
        <button class="copy-btn" id="copyBtn" onclick="handleCopy()">Salin</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-ghost" onclick="goToEdit()">← Edit Judul</button>
      <button class="btn" onclick="handleReset()">↺ Buat Baru</button>
    </div>
  </div>
</main>

<footer>PANTAU · Formatter Digest · Netlify · Sumber: Google News</footer>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────
const MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

const UPPERCASE_WORDS = new Set([
  'MBG','BGN','CKG','RI','DPR','KPK','TNI','POLRI','BIN','BPOM','BPJS','BNPB',
  'BNPT','KPU','MK','MA','KY','OJK','BI','BEI','IHSG','PPN','PPH','UMP','UMK',
  'UMR','PHK','UMKM','BUMN','APBN','APBD','PPATK','KPR','SIM','KTP','NIK','NPWP',
  'USD','IDR','GDP','IMF','WHO','PBB','NATO','ASEAN','G20','WTO','FAO','UNESCO',
  'COVID','HIV','AIDS','DBD','TBC','ISPA','ICU','UGM','UI','ITB','IPB','ITS',
  'PDIP','PKS','PKB','PPP','PAN','NASDEM','GOLKAR','GERINDRA','DEMOKRAT','PSI',
  'TV','CEO','COO','CFO','HUT','AS','EU','PDB','BBM','LPG','KRL','MRT','LRT',
  'RS','RSUD','RSUP','SD','SMP','SMA','SMK','PT','CV','RUU','UU','PP','PMI',
  'WNI','WNA','BLT','BST','BSU','PKH','KIP','KIS','JKN','PJBT','PLT','PLH',
]);

const LOWERCASE_WORDS = new Set([
  'di','ke','dari','dan','atau','yang','untuk','dengan','dalam','pada','oleh',
  'atas','bagi','per','karena','saat','jika','agar','hingga','serta','namun',
  'tetapi','maupun','antara','sekitar','lewat','melalui','juga','tak','pun',
]);

// ── STATE ──────────────────────────────────────────────────────────
let items = []; // [{url, title}]

// ── INIT ───────────────────────────────────────────────────────────
(function init() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm   = String(today.getMonth() + 1).padStart(2, '0');
  const dd   = String(today.getDate()).padStart(2, '0');
  document.getElementById('fDate').value = `${yyyy}-${mm}-${dd}`;
})();

// ── SLUG → TITLE ───────────────────────────────────────────────────
function toTitleCase(str) {
  return str.split(' ').map(function(word, i) {
    if (!word) return word;
    const upper = word.toUpperCase();
    if (UPPERCASE_WORDS.has(upper)) return upper;
    if (i > 0 && LOWERCASE_WORDS.has(word.toLowerCase())) return word.toLowerCase();
    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
  }).join(' ');
}

function extractTitle(url) {
  try {
    const pathname = new URL(url).pathname;
    const segments = pathname.split('/').filter(Boolean);
    if (!segments.length) return url;
    let slug = '';
    for (let i = segments.length - 1; i >= 0; i--) {
      const seg = segments[i];
      if (/^\d+$/.test(seg) || seg.length < 5) continue;
      slug = seg; break;
    }
    if (!slug) return url;
    slug = slug.replace(/-\d+(-\d+)*$/, '');
    slug = slug.replace(/^(video|foto|infografis|podcast|live)-/, '');
    return toTitleCase(slug.replace(/-/g, ' ').trim());
  } catch(e) { return url; }
}

// ── FORMAT DATE ────────────────────────────────────────────────────
function formatDateLabel(dateStr) {
  const parts = dateStr.split('-').map(Number);
  return parts[2] + ' ' + MONTHS_ID[parts[1] - 1] + ' ' + parts[0];
}

// ── STEPS ──────────────────────────────────────────────────────────
function setStep(n) {
  [1,2,3].forEach(function(i) {
    const el = document.getElementById('step' + i);
    el.className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
  });
  document.getElementById('panel-input').style.display  = n === 1 ? '' : 'none';
  document.getElementById('panel-edit').style.display   = n === 2 ? '' : 'none';
  document.getElementById('panel-output').style.display = n === 3 ? '' : 'none';
}

// ── STEP 1 → 2 ─────────────────────────────────────────────────────
function handleGenerate() {
  const raw = document.getElementById('fUrls').value;
  const urlList = raw.split('\n').map(function(u){ return u.trim(); }).filter(function(u){ return u.startsWith('http'); });
  const errEl = document.getElementById('inputError');

  if (!urlList.length) {
    errEl.textContent = 'Masukkan minimal satu URL yang valid.';
    errEl.style.display = '';
    return;
  }
  errEl.style.display = 'none';

  items = urlList.map(function(u){ return { url: u, title: extractTitle(u) }; });
  renderEditList();
  setStep(2);
}

function renderEditList() {
  const list = document.getElementById('editList');
  list.innerHTML = items.map(function(item, i){
    return '<div class="edit-item">' +
      '<div class="edit-num">Berita ' + (i+1) + '</div>' +
      '<input type="text" value="' + esc(item.title) + '" oninput="items[' + i + '].title=this.value" />' +
      '<div class="edit-url">' + esc(item.url) + '</div>' +
      '</div>';
  }).join('');
}

// ── STEP 2 → 3 ─────────────────────────────────────────────────────
function handleFinalize() {
  const date     = document.getElementById('fDate').value;
  const initials = document.getElementById('fInitials').value.trim() || 'PS';
  const header   = "*What's In The News (" + formatDateLabel(date) + ") - " + initials + "*";
  const lines    = items.map(function(item){
    return '- ' + item.title + '\n> ' + item.url;
  }).join('\n\n');
  const output   = header + '\n\n' + lines;

  const textarea = document.getElementById('outputText');
  textarea.value = output;
  // Auto-resize rows
  textarea.rows  = Math.min(output.split('\n').length + 2, 30);

  document.getElementById('copyInfo').textContent = items.length + ' berita · ' + formatDateLabel(date);
  document.getElementById('copyBtn').textContent = 'Salin';
  document.getElementById('copyBtn').className = 'copy-btn';

  setStep(3);
}

// ── COPY ───────────────────────────────────────────────────────────
function handleCopy() {
  const output = document.getElementById('outputText').value;
  const btn    = document.getElementById('copyBtn');
  try {
    const el = document.createElement('textarea');
    el.value = output;
    el.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(el);
    el.focus(); el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    btn.textContent = '✓ Tersalin!';
    btn.className = 'copy-btn copied';
    setTimeout(function(){ btn.textContent = 'Salin'; btn.className = 'copy-btn'; }, 2500);
  } catch(e) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(output).then(function(){
        btn.textContent = '✓ Tersalin!';
        btn.className = 'copy-btn copied';
        setTimeout(function(){ btn.textContent = 'Salin'; btn.className = 'copy-btn'; }, 2500);
      });
    }
  }
}

// ── NAV ────────────────────────────────────────────────────────────
function goBack()   { setStep(1); }
function goToEdit() { renderEditList(); setStep(2); }
function handleReset() {
  items = [];
  document.getElementById('fUrls').value = '';
  document.getElementById('inputError').style.display = 'none';
  setStep(1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── UTIL ───────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
